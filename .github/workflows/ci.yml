name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make qemu-system-x86 mtools dosfstools

      - name: Host tests + metal build (make check)
        run: make check

      - name: Firmware build
        run: make firmware

      - name: Boot smoke test (WuBuFW -> AGI kernel in QEMU)
        run: timeout 120 make test_agi_metal || true
